name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 不要設 registry-url:setup-node 會寫一份帶空 _authToken 的 .npmrc,OIDC 會接不到手。
      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit

      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || { echo "tag v$tag != package.json $pkg"; exit 1; }

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      # 上面已跑過 prepublishOnly 的內容,所以略過 scripts。
      # 認證走 OIDC:trusted publisher 綁在 npmjs.com 的 @anyknown/axis → anyknown-com/axis / release.yml。
      # (v0.1.0 由本機手動發:npm 的 trusted publisher 只能綁在已存在的套件上。)
      - run: npm publish --ignore-scripts
